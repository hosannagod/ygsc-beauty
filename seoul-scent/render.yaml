services:
  - type: web
    name: seoul-scent
    rootDir: seoul-scent
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_PATH
        value: /var/data/seoul-scent.db
    disk:
      name: seoul-scent-data
      mountPath: /var/data
      sizeGB: 1
